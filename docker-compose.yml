services:
  panel:
    build: ./panel
    container_name: mc-panel
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PANEL_PORT:-8080}:8080"
    volumes:
      # Panel Docker ko control karta hai taaki Minecraft server containers bana sake
      - /var/run/docker.sock:/var/run/docker.sock
      - panel-data:/app/data

volumes:
  panel-data:
