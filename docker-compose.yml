services:
  panel:
    build: ./panel
    container_name: mc-panel
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PANEL_PORT:-8080}:8080"
    volumes:
      # Panel Docker ko control karta hai taaki Minecraft server containers bana sake
      - /var/run/docker.sock:/var/run/docker.sock
      - panel-data:/app/data
      # World backups (also mounted by short-lived helper containers, so the name must stay "mc-backups")
      - backups:/app/backups

  # Image for the AI agents (never started by compose; the panel creates one container per server).
  # Build/update it with:  docker compose --profile ai build ai-agents
  ai-agents:
    build: ./ai-agents
    image: craftpanel-ai-agents:latest
    profiles: ["ai"]

volumes:
  panel-data:
  backups:
    name: mc-backups
