<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftPanel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%238b5a2b'/><rect width='16' height='5' fill='%235bd75b'/><rect y='5' width='3' height='2' fill='%235bd75b'/><rect x='9' y='5' width='4' height='2' fill='%235bd75b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <!-- ========== LOGIN ========== -->
  <section id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="logo big"><span class="block"></span><span>CraftPanel</span></div>
      <p class="muted">Apne Minecraft servers manage karo</p>
      <input type="text" id="username" placeholder="Username (admin ke liye khaali chhodo)" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button class="mc-btn green wide" type="submit">▶ Login</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- ========== APP ========== -->
  <section id="app-view" class="app hidden">
    <header class="topbar">
      <div class="logo"><span class="block"></span><span>CraftPanel</span></div>
      <div class="host-stats" id="host-stats"></div>
      <span class="chip role-chip hidden" id="role-chip"></span>
      <button class="mc-btn ghost small hidden" id="users-btn" title="View-only accounts">👥 Users</button>
      <button class="icon-btn" id="logout-btn" title="Logout">⏻</button>
    </header>

    <aside class="sidebar">
      <div class="side-head">
        <span>Servers</span>
        <button class="mc-btn green small" id="new-btn">+ New</button>
      </div>
      <nav id="server-list"></nav>
    </aside>

    <main id="main"></main>
  </section>

  <!-- ========== MODAL (create / confirm) ========== -->
  <div id="modal" class="modal hidden">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
